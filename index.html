<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Production Engine Platform v16 - Concurrent Architecture</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/chess.js/0.10.3/chess.min.js"></script>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #121214; color: #fff;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            min-height: 100vh; margin: 0; padding: 20px; box-sizing: border-box;
        }
        .wrapper { max-width: 1200px; width: 100%; display: flex; flex-direction: column; align-items: center; gap: 20px; }
        
        #input-phase {
            background-color: #1e1e24; border-radius: 8px; padding: 25px; width: 100%; max-width: 600px;
            box-shadow: 0 10px 15px -3px rgba(0,0,0,0.5); display: flex; flex-direction: column; gap: 15px;
        }
        textarea {
            width: 100%; height: 140px; background-color: #121214; border: 1px solid #3f3f46;
            border-radius: 6px; color: #cbd5e1; padding: 12px; font-family: monospace; font-size: 0.9rem; resize: none; box-sizing: border-box;
        }
        
        .config-grid { display: grid; grid-template-columns: 1fr; gap: 10px; }
        .config-group { display: flex; flex-direction: column; gap: 5px; }
        .config-group label { font-size: 0.8rem; color: #a1a1aa; font-weight: bold; }
        .config-select {
            background-color: #121214; border: 1px solid #3f3f46; border-radius: 4px;
            color: #fff; padding: 8px; font-size: 0.9rem; cursor: pointer;
        }

        #analysis-phase { display: none; flex-direction: column; gap: 20px; width: 100%; align-items: center; }
        .main-layout { display: flex; flex-direction: row; gap: 20px; width: 100%; justify-content: center; align-items: flex-start; }
        @media (max-width: 900px) { .main-layout { flex-direction: column; align-items: center; } }
        
        .board-container { display: flex; flex-direction: row; gap: 15px; position: relative; }
        
        .eval-bar-wrapper {
            width: 24px; height: 480px; background-color: #27272a; border-radius: 4px;
            overflow: hidden; display: flex; flex-direction: column; box-shadow: 0 10px 15px -3px rgba(0,0,0,0.5);
            position: relative; border: 1px solid #3f3f46;
        }
        .eval-bar-black { width: 100%; background-color: #1b1b1b; transition: height 0.25s cubic-bezier(0.4, 0, 0.2, 1); height: 50%; }
        .eval-bar-white { width: 100%; background-color: #ffffff; transition: height 0.25s cubic-bezier(0.4, 0, 0.2, 1); flex-grow: 1; }
        .eval-text-marker {
            position: absolute; width: 100%; text-align: center; left: 0; font-size: 0.75rem; font-weight: bold;
            font-family: monospace; z-index: 10; mix-blend-mode: difference; color: #fff;
        }
        .eval-text-top { top: 8px; } .eval-text-bottom { bottom: 8px; }

        .board-wrapper-relative { position: relative; width: 480px; height: 480px; }
        #chessboard {
            display: grid; grid-template-columns: repeat(8, 1fr); grid-template-rows: repeat(8, 1fr);
            width: 100%; height: 100%; border: 4px solid #27272a; box-shadow: 0 20px 25px -5px rgba(0,0,0,0.7);
            position: absolute; top: 0; left: 0; z-index: 1; box-sizing: border-box;
        }
        #board-svg-overlay { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 5; pointer-events: none; }
        
        .square { display: flex; align-items: center; justify-content: center; font-size: 40px; user-select: none; position: relative; }
        .light { background-color: #ebecd0; color: #779556; } .dark { background-color: #779556; color: #ebecd0; }
        .last-move { background-color: rgba(247, 247, 105, 0.35) !important; }
        
        .panel {
            flex: 1; background-color: #1e1e24; border-radius: 8px; padding: 20px; box-sizing: border-box;
            width: 100%; max-width: 520px; box-shadow: 0 10px 15px -3px rgba(0,0,0,0.5); display: flex; flex-direction: column; gap: 15px;
        }
        .accuracy-summary {
            display: grid; grid-template-columns: 1fr 1fr; gap: 15px; background: #121214; 
            padding: 12px; border-radius: 6px; border: 1px solid #27272a; text-align: center;
        }
        .accuracy-val { font-size: 1.5rem; font-weight: bold; color: #81b64c; margin-top: 4px; }
        
        .controls-row { display: flex; gap: 10px; width: 100%; }
        .btn {
            background-color: #81b64c; color: #fff; border: none; padding: 12px 24px; font-size: 1.1rem;
            font-weight: bold; border-radius: 5px; cursor: pointer; transition: background-color 0.2s; text-align: center; flex: 1;
        }
        .btn:hover { background-color: #a3d96a; }
        .btn-secondary { background-color: #3f3f46; }
        .btn-secondary:hover { background-color: #52525b; }
        
        .log-box {
            background-color: #121214; border: 1px solid #3f3f46; border-radius: 6px; padding: 15px;
            height: 250px; overflow-y: auto; font-family: monospace; font-size: 0.9rem; color: #cbd5e1; display: flex; flex-direction: column; gap: 10px;
        }
        .ticker-line { padding: 10px; border-radius: 4px; background: #18181b; border-left: 4px solid #52525b; cursor: pointer; }
        .ticker-line:hover { background: #27272a; }
        .ticker-line.active-view { border-left-color: #81b64c; background: #27272a; }
        .ticker-line.critical-swing { border-left-color: #f43f5e; background: rgba(244, 63, 94, 0.05); }

        .badge { display: inline-block; padding: 2px 6px; border-radius: 4px; font-weight: bold; font-size: 0.8rem; margin-right: 8px; text-transform: uppercase; }
        
        .pending { background-color: #3f3f46; color: #a1a1aa; }
        .best { background-color: #26bb72; color: white; }
        .excellent { background-color: #96bc4b; color: white; }
        .good { background-color: #5c8a32; color: white; }
        .inaccuracy { background-color: #f0c15c; color: #1e1e24; }
        .mistake { background-color: #e58f2a; color: white; }
        .blunder { background-color: #b23330; color: white; }
        
        .pv-container { font-size: 0.8rem; color: #a1a1aa; margin-top: 4px; font-style: italic; }
        .suggestion-box { font-size: 0.85rem; color: #f43f5e; margin-top: 6px; padding-top: 6px; border-top: 1px dashed #3f3f46; }
        .loader { display: flex; align-items: center; gap: 10px; color: #a1a1aa; font-size: 0.9rem; }
        .spinner { width: 14px; height: 14px; border: 2px solid #3f3f46; border-top: 2px solid #81b64c; border-radius: 50%; animation: spin 1s linear infinite; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        
        .graph-container {
            width: 100%; background-color: #1e1e24; border-radius: 8px; padding: 15px; box-sizing: border-box;
            box-shadow: 0 10px 15px -3px rgba(0,0,0,0.5); display: flex; flex-direction: column; gap: 10px;
        }
        .evaluation-graph { width: 100%; height: 120px; overflow: visible; }
        .graph-line { fill: none; stroke: #81b64c; stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; }
        .graph-zero-line { stroke: #3f3f46; stroke-width: 1; stroke-dasharray: 4; }
        .graph-dot { fill: #81b64c; stroke: #1e1e24; stroke-width: 2; cursor: pointer; }
        .graph-dot:hover, .graph-dot.active-dot { r: 6; fill: #a3d96a; }
        .graph-dot.critical-dot { fill: #f43f5e; stroke: #fff; }
    </style>
</head>
<body>

    <div class="wrapper">
        <div id="input-phase">
            <h2 style="margin:0; font-weight: 500;">Configure Pipeline Profile</h2>
            <div class="config-grid">
                <div class="config-group">
                    <label for="select-depth">Stockfish 16.1 Target Depth</label>
                    <select id="select-depth" class="config-select">
                        <option value="12">Iterative Shallow (Depth 12)</option>
                        <option value="15" selected>Standard Balanced (Depth 15)</option>
                        <option value="18">Deep Core Analysis (Depth 18)</option>
                    </select>
                </div>
            </div>
            <textarea id="pgn-input" placeholder="1. e4 e5 2. Nf3 Nc6 3. Bb5 a6 4. Ba4 Nf6..."></textarea>
            <button id="submit-pgn-btn" class="btn">Initialize Persistent Queue Engine</button>
        </div>

        <div id="analysis-phase">
            <div class="main-layout">
                <div class="board-container">
                    <div class="eval-bar-wrapper" id="eval-bar-container">
                        <div class="eval-text-marker eval-text-top" id="eval-label-black"></div>
                        <div class="eval-bar-black" id="eval-split-black"></div>
                        <div class="eval-bar-white" id="eval-split-white"></div>
                        <div class="eval-text-marker eval-text-bottom" id="eval-label-white"></div>
                    </div>
                    
                    <div class="board-wrapper-relative">
                        <div id="chessboard"></div>
                        <svg id="board-svg-overlay" viewBox="0 0 800 800">
                            <defs>
                                <marker id="arrow-engine" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
                                    <path d="M 0 1 L 10 5 L 0 9 z" fill="#f59e0b"/>
                                </marker>
                            </defs>
                            <g id="svg-arrows-group"></g>
                        </svg>
                    </div>
                </div>

                <div class="panel">
                    <h2 style="margin:0; font-weight: 500;">Live Analytical Feed</h2>
                    
                    <div class="accuracy-summary">
                        <div>
                            <div style="font-size:0.8rem; color:#a1a1aa; font-weight:bold;">WHITE ACCURACY</div>
                            <div class="accuracy-val" id="accuracy-white">--</div>
                        </div>
                        <div>
                            <div style="font-size:0.8rem; color:#a1a1aa; font-weight:bold;">BLACK ACCURACY</div>
                            <div class="accuracy-val" id="accuracy-black">--</div>
                        </div>
                    </div>

                    <div id="engine-status" class="loader">
                        <div class="spinner"></div>
                        <span id="status-text">Ready...</span>
                    </div>
                    <div class="log-box" id="analysis-log"></div>
                    <div class="controls-row">
                        <button id="prev-btn" class="btn btn-secondary">◀ Prev</button>
                        <button id="autoplay-btn" class="btn">Autoplay</button>
                        <button id="next-btn" class="btn btn-secondary">Next ▶</button>
                    </div>
                </div>
            </div>
            
            <div class="graph-container">
                <div style="font-size: 0.9rem; color: #a1a1aa; font-weight: bold;">Uniform Normalization Matrix Map</div>
                <svg class="evaluation-graph" id="eval-graph-svg" viewBox="0 0 1000 120" preserveAspectRatio="none">
                    <line class="graph-zero-line" x1="0" y1="60" x2="1000" y2="60"></line>
                    <path class="graph-line" d="M 0 60 L 1000 60"></path>
                    <g id="graph-dots-group"></g>
                </svg>
            </div>
        </div>
    </div>

    <script>
        const piecesSymbols = {
            'r': '♜', 'n': '♞', 'b': '♝', 'q': '♛', 'k': '♚', 'p': '♟',
            'R': '♖', 'N': '♘', 'B': '♗', 'Q': '♕', 'K': '♔', 'P': '♙'
        };

        // --- SIZE-RESTRICTED LRU CACHE INFRASTRUCTURE ---
        class LRUCache {
            constructor(maxEntries = 1000) {
                this.maxEntries = maxEntries;
                this.store = new Map();
            }
            read(key) {
                if (!this.store.has(key)) return null;
                const value = this.store.get(key);
                this.store.delete(key);
                this.store.set(key, value);
                return value;
            }
            write(key, value) {
                if (this.store.has(key)) this.store.delete(key);
                else if (this.store.size >= this.maxEntries) {
                    this.store.delete(this.store.keys().next().value);
                }
                this.store.set(key, value);
            }
        }

        const SAN_LRU_CACHE = new LRUCache(2000);
        function memoizedUCIToSAN(fen, uciMove) {
            if (!uciMove || uciMove.length < 4) return '';
            const cacheKey = `${fen}#${uciMove}`;
            const cached = SAN_LRU_CACHE.read(cacheKey);
            if (cached) return cached;

            const tempInstance = new Chess(fen);
            const moveData = tempInstance.move({
                from: uciMove.substring(0, 2),
                to: uciMove.substring(2, 4),
                promotion: uciMove.substring(4) || undefined
            });
            const sanResult = moveData ? moveData.san : uciMove;
            SAN_LRU_CACHE.write(cacheKey, sanResult);
            return sanResult;
        }

        const AppState = {
            session: { analysisId: 0, targetDepth: 15 },
            game: { timeline: [] },
            analysis: { evaluations: [] },
            replay: { index: -1, autoplay: { active: false, intervalId: null } },
            cache: new LRUCache(1000)
        };

        // --- DOUBLE-BOUNDED MASTER UNIFORM NORMALIZER (THE SINGLE SOURCE OF TRUTH) ---
        const Normalizer = {
            MATE_BOUND: 100000,

            // Raw engine values mapped onto White absolute perspective scale
            // Returns: Integer scale where >0 is White advantage, <0 is Black advantage
            whiteCentricAbsolute(type, rawValue, sideToMove) {
                if (type === 'mate') {
                    if (rawValue === 0) return sideToMove === 'w' ? -this.MATE_BOUND : this.MATE_BOUND;
                    const sign = rawValue > 0 ? 1 : -1;
                    const plies = Math.abs(rawValue);
                    const absoluteMoverScore = this.MATE_BOUND - plies;
                    
                    // Transform to White perspective scale
                    if (sideToMove === 'w') {
                        return sign > 0 ? absoluteMoverScore : -absoluteMoverScore;
                    } else {
                        return sign > 0 ? -absoluteMoverScore : absoluteMoverScore;
                    }
                }
                // Centipawn handling conversion layer
                return sideToMove === 'w' ? rawValue : -rawValue;
            },

            // Uniform compression across the entire application workspace
            // Maps engine space to a clean [0, 120] UI coordinate plane
            compressToY(absoluteScore) {
                if (Math.abs(absoluteScore) >= (this.MATE_BOUND - 500)) {
                    return absoluteScore > 0 ? 5 : 115;
                }
                // Tanh transformation curve scaling factor
                return 60 - (Math.tanh(absoluteScore / 600) * 52);
            }
        };

        const Selectors = {
            getTimelineLength() { return AppState.game.timeline.length; },
            getMoveAt(index) { return (index >= 0 && index < AppState.game.timeline.length) ? AppState.game.timeline[index] : null; },
            getAnalysisAt(index) { return (index >= 0 && index < AppState.analysis.evaluations.length) ? AppState.analysis.evaluations[index] : null; },
            assertSessionAlive(sessionId) { return AppState.session.analysisId === sessionId; }
        };

        // --- NON-BLOCKING EVENT RENDER QUEUE ARCHITECTURE ---
        const RenderQueue = {
            dirtyIndices: new Set(),
            frameRequested: false,
            liveAccuracyPending: false,
            accuracyData: { wTotal: 0, wCount: 0, bTotal: 0, bCount: 0 },

            enqueueRowUpdate(index) {
                this.dirtyIndices.add(index);
                this.requestFlush();
            },
            enqueueAccuracy(wTotal, wCount, bTotal, bCount) {
                this.accuracyData = { wTotal, wCount, bTotal, bCount };
                this.liveAccuracyPending = true;
                this.requestFlush();
            },
            requestFlush() {
                if (this.frameRequested) return;
                this.frameRequested = true;
                requestAnimationFrame(() => this.flush());
            },
            flush() {
                this.frameRequested = false;
                if (this.dirtyIndices.size > 0) {
                    this.dirtyIndices.forEach(idx => {
                        appendMoveRowDOM(idx);
                        patchEvalGraphDotDOM(idx);
                    });
                    this.dirtyIndices.clear();
                }
                if (this.liveAccuracyPending) {
                    this.liveAccuracyPending = false;
                    const { wTotal, wCount, bTotal, bCount } = this.accuracyData;
                    
                    // Analytical accuracy scoring calculation metrics
                    if (wCount > 0) {
                        const wAcc = Math.round(100 * Math.exp(-0.0045 * (wTotal / wCount)));
                        document.getElementById('accuracy-white').textContent = `${Math.min(100, Math.max(10, wAcc))}%`;
                    }
                    if (bCount > 0) {
                        const bAcc = Math.round(100 * Math.exp(-0.0045 * (bTotal / bCount)));
                        document.getElementById('accuracy-black').textContent = `${Math.min(100, Math.max(10, bAcc))}%`;
                    }
                }
            }
        };

        // --- PERSISTENT CONCURRENT MULTI-WORKER ENGINE PIPELINE ---
        class StockfishWorkerWrapper {
            constructor(workerUrl) {
                this.worker = new Worker(workerUrl);
                this.currentDeferred = null;
                this.isReady = false;
                this.buffer = [];
                
                this.worker.onmessage = (e) => this._handleMessage(e.data);
                this.worker.postMessage('uci');
                this.worker.postMessage('setoption name Hash value 64');
                this.worker.postMessage('setoption name MultiPV value 4');
                this.worker.postMessage('isready');
            }

            executeAnalysis(fen, depth, forcedMove = null) {
                this.cancel();
                return new Promise((resolve, reject) => {
                    this.currentDeferred = { resolve, reject, fen, forcedMove };
                    this.buffer = [];
                    this.worker.postMessage(`position fen ${fen}`);
                    if (forcedMove) {
                        this.worker.postMessage(`go depth ${depth} searchmoves ${forcedMove}`);
                    } else {
                        this.worker.postMessage(`go depth ${depth}`);
                    }
                });
            }

            cancel() {
                if (this.currentDeferred) {
                    this.worker.postMessage('stop');
                    this.currentDeferred.reject({ cancelled: true });
                    this.currentDeferred = null;
                }
            }

            _handleMessage(line) {
                if (line === 'readyok') { this.isReady = true; return; }
                if (!this.currentDeferred) return;
                
                this.buffer.push(line);
                if (line.includes('bestmove')) {
                    const def = this.currentDeferred;
                    this.currentDeferred = null;
                    const parsed = this._parseTelemetry(this.buffer, def.fen, def.forcedMove);
                    def.resolve(parsed);
                }
            }

            _parseTelemetry(lines, fen, forcedMove) {
                const gameContext = new Chess(fen);
                const sideToMove = gameContext.turn();
                let multiPvLines = [];
                let bestMoveUCI = '';

                for (const line of lines) {
                    if (line.includes('info depth') && (line.includes('cp') || line.includes('mate'))) {
                        const cpMatch = line.match(/cp (-?\d+)/);
                        const mateMatch = line.match(/mate (-?\d+)/);
                        const pvMatch = line.match(/pv\s(.+)/);
                        const multipvMatch = line.match(/multipv (\d+)/);

                        if ((cpMatch || mateMatch) && pvMatch) {
                            let rawType = cpMatch ? 'cp' : 'mate';
                            let rawVal = cpMatch ? parseInt(cpMatch[1]) : parseInt(mateMatch[1]);
                            
                            const absoluteScore = Normalizer.whiteCentricAbsolute(rawType, rawVal, sideToMove);
                            const multiIndex = multipvMatch ? parseInt(multipvMatch[1]) : 1;
                            const uci = pvMatch[1].split(' ')[0];

                            const linePayload = { absoluteScore, uci, multiIndex, rawPv: pvMatch[1] };
                            const oldIdx = multiPvLines.findIndex(item => item.multiIndex === multiIndex);
                            
                            if (oldIdx !== -1) {
                                if (!forcedMove || uci === forcedMove) multiPvLines[oldIdx] = linePayload;
                            } else {
                                multiPvLines.push(linePayload);
                            }
                        }
                    }
                    if (line.includes('bestmove')) {
                        const bm = line.match(/bestmove\s([a-h][1-8][a-h][1-8][qrbn]?)/);
                        if (bm && bm[1] !== '(none)') bestMoveUCI = bm[1];
                    }
                }
                return { bestMoveUCI, multiPvLines: multiPvLines.sort((a,b) => a.multiIndex - b.multiIndex) };
            }
        }

        // Dedicated global worker instances initialized once on initial load
        const SF_URL = 'https://cdnjs.cloudflare.com/ajax/libs/stockfish.js/16.0.0/stockfish-nnue-16.js';
        const PrimaryWorker = new StockfishWorkerWrapper(SF_URL);
        const BackgroundWorker = new StockfishWorkerWrapper(SF_URL);

        // --- NON-BLOCKING BACKGROUND QUANTUM QUEUE SCHEDULER ---
        const AnalysisScheduler = {
            queue: [],
            isProcessing: false,
            currentSessionId: 0,

            reset(sessionId) {
                this.queue = [];
                this.currentSessionId = sessionId;
                this.isProcessing = false;
                BackgroundWorker.cancel();
            },

            enqueue(index, fen, depth) {
                this.queue.push({ index, fen, depth });
                this.kickProcessor();
            },

            async kickProcessor() {
                if (this.isProcessing || this.queue.length === 0) return;
                this.isProcessing = true;

                while (this.queue.length > 0) {
                    if (!Selectors.assertSessionAlive(this.currentSessionId)) {
                        this.isProcessing = false;
                        return;
                    }
                    
                    const task = this.queue.shift();
                    
                    // Optimization: Skip calculations if a higher priority result is already cached
                    const cacheKey = `${task.fen}#D:${task.depth}`;
                    let metrics = AppState.cache.read(cacheKey);

                    if (!metrics) {
                        try {
                            metrics = await BackgroundWorker.executeAnalysis(task.fen, task.depth);
                            AppState.cache.write(cacheKey, metrics);
                        } catch (e) {
                            metrics = null;
                        }
                    }

                    if (metrics && Selectors.assertSessionAlive(this.currentSessionId)) {
                        processEvaluationPayload(task.index, task.fen, metrics);
                    }
                }
                this.isProcessing = false;
            }
        };

        // --- ATOMIC STATE SEPARATION PIPELINE ---
        function processEvaluationPayload(index, fenBefore, engineMetrics) {
            if (AppState.analysis.evaluations[index]) return; // Position evaluation already locked

            const currentMoveNode = Selectors.getMoveAt(index);
            const gameContext = new Chess(fenBefore);
            const moverIsWhite = gameContext.turn() === 'w';
            const playedUCI = currentMoveNode.uci;

            let playedAbsoluteScore = null;
            let lookaheadMatch = engineMetrics.multiPvLines.find(l => l.uci === playedUCI);
            
            // Critical turning point approximation heuristic calculation using MultiPV entropy gap
            let isCritical = false;
            if (engineMetrics.multiPvLines.length >= 2) {
                const gap = Math.abs(engineMetrics.multiPvLines[0].absoluteScore - engineMetrics.multiPvLines[1].absoluteScore);
                if (gap > 175) isCritical = true;
            }

            if (lookaheadMatch) {
                playedAbsoluteScore = lookaheadMatch.absoluteScore;
            } else if (playedUCI === engineMetrics.bestMoveUCI && engineMetrics.multiPvLines.length > 0) {
                playedAbsoluteScore = engineMetrics.multiPvLines[0].absoluteScore;
            } else {
                // Approximate fallback evaluation scoring threshold
                playedAbsoluteScore = engineMetrics.multiPvLines[0] 
                    ? engineMetrics.multiPvLines[0].absoluteScore - (moverIsWhite ? 250 : -250)
                    : 0;
            }

            const bestAbsoluteScore = engineMetrics.multiPvLines[0]?.absoluteScore ?? 0;
            const absoluteCplLoss = moverIsWhite 
                ? Math.max(0, bestAbsoluteScore - playedAbsoluteScore)
                : Math.max(0, playedAbsoluteScore - bestAbsoluteScore);

            const isCheckmateNode = index === Selectors.getTimelineLength() - 1 && currentMoveNode.san.includes('#');
            const classification = classifyCPL(absoluteCplLoss, isCheckmateNode, isCritical);

            let traceStr = "";
            if (engineMetrics.multiPvLines.length > 0) {
                traceStr = engineMetrics.multiPvLines[0].rawPv.split(' ').slice(0, 2)
                    .map(u => memoizedUCIToSAN(fenBefore, u)).join(' ');
            }

            const explanation = ["blunder", "mistake", "inaccuracy"].includes(classification.class)
                ? `Instead of ${currentMoveNode.san}, optimal line was ${memoizedUCIToSAN(fenBefore, engineMetrics.bestMoveUCI)}. Info: [ ${traceStr}... ]`
                : `Precision line: [ ${traceStr}... ]`;

            // Write results atomically to state tracking object
            AppState.analysis.evaluations[index] = {
                classification,
                explanation,
                absoluteScore: playedAbsoluteScore,
                bestMoveUCI: engineMetrics.bestMoveUCI,
                critical: isCritical
            };

            RenderQueue.enqueueRowUpdate(index);
            recalculateGlobalAccuracyMetrics();

            if (index === AppState.replay.index) {
                renderEvaluationBarsDOM(playedAbsoluteScore);
                drawBestMoveArrow(engineMetrics.bestMoveUCI);
            }
        }

        function recalculateGlobalAccuracyMetrics() {
            let wTotal = 0, wCount = 0, bTotal = 0, bCount = 0;
            for (let i = 0; i < AppState.analysis.evaluations.length; i++) {
                const ev = AppState.analysis.evaluations[i];
                if (!ev) continue;
                
                const moveNode = Selectors.getMoveAt(i);
                const prevFen = i === 0 ? "rnbqkbnr/pppppppp/8/8/8/8/PPPPPPPP/RNBQKBNR w KQkq - 0 1" : Selectors.getMoveAt(i-1).fenAfter;
                const wasWhite = new Chess(prevFen).turn() === 'w';

                // Check historical bounds to extract raw absolute delta scales
                const baseScore = i === 0 ? 0 : AppState.analysis.evaluations[i-1]?.absoluteScore ?? 0;
                const variance = Math.abs(ev.absoluteScore - baseScore);

                if (wasWhite) { wTotal += variance; wCount++; }
                else { bTotal += variance; bCount++; }
            }
            RenderQueue.enqueueAccuracy(wTotal, wCount, bTotal, bCount);
        }

        // --- OPTIMIZED STRUCTURAL DOM RETENTION INTERACTION LAYER ---
        const boardElement = document.getElementById('chessboard');
        const logElement = document.getElementById('analysis-log');
        const statusText = document.getElementById('status-text');
        const engineStatus = document.getElementById('engine-status');
        const graphSvg = document.getElementById('eval-graph-svg');
        const graphLine = graphSvg.querySelector('.graph-line');
        const graphDotsGroup = document.getElementById('graph-dots-group');
        const svgArrowsGroup = document.getElementById('svg-arrows-group');

        function initializeStaticChessboardGrid() {
            boardElement.innerHTML = '';
            for (let r = 0; r < 8; r++) {
                for (let c = 0; c < 8; c++) {
                    const sq = document.createElement('div');
                    sq.className = `square ${(r + c) % 2 === 0 ? 'light' : 'dark'}`;
                    sq.id = `sq-${r}-${c}`;
                    boardElement.appendChild(sq);
                }
            }
        }

        function renderBoardStateFromFen(fen, highlight = null) {
            const tempBoard = new Chess(fen);
            const matrix = tempBoard.board();
            for (let r = 0; r < 8; r++) {
                for (let c = 0; c < 8; c++) {
                    const sq = document.getElementById(`sq-${r}-${c}`);
                    const piece = matrix[r][c];
                    const targetSymbol = piece ? piecesSymbols[piece.color === 'w' ? piece.type.toUpperCase() : piece.type.toLowerCase()] : '';
                    
                    if (sq.textContent !== targetSymbol) sq.textContent = targetSymbol;
                    
                    sq.className = `square ${(r + c) % 2 === 0 ? 'light' : 'dark'}`;
                    if (highlight) {
                        const name = String.fromCharCode(97 + c) + (8 - r);
                        if (highlight.from === name || highlight.to === name) sq.classList.add('last-move');
                    }
                }
            }
        }

        function renderEvaluationBarsDOM(absoluteScore) {
            const splitWhite = document.getElementById('eval-split-white');
            const splitBlack = document.getElementById('eval-split-black');
            const labelWhite = document.getElementById('eval-label-white');
            const labelBlack = document.getElementById('eval-label-black');

            labelWhite.textContent = ''; labelBlack.textContent = '';

            if (absoluteScore === null) {
                splitBlack.style.height = "50%"; splitWhite.style.height = "50%";
                return;
            }

            const yCoordinate = Normalizer.compressToY(absoluteScore);
            const blackPercent = (yCoordinate / 120) * 100;
            const whitePercent = 100 - blackPercent;

            splitBlack.style.height = `${blackPercent}%`;
            splitWhite.style.height = `${whitePercent}%`;

            if (Math.abs(absoluteScore) >= (Normalizer.MATE_BOUND - 500)) {
                const label = absoluteScore > 0 ? "M" : "-M";
                if (absoluteScore > 0) labelWhite.textContent = label; else labelBlack.textContent = label;
                return;
            }

            const printableMetric = (absoluteScore / 100).toFixed(1);
            if (absoluteScore >= 0) {
                labelWhite.textContent = `+${printableMetric}`;
            } else {
                labelBlack.textContent = printableMetric;
            }
        }

        function drawBestMoveArrow(bestMoveUCI) {
            svgArrowsGroup.innerHTML = '';
            if (!bestMoveUCI || bestMoveUCI.length < 4) return;

            const fromPt = { x: (bestMoveUCI.charCodeAt(0) - 97) * 100 + 50, y: (8 - parseInt(bestMoveUCI.charAt(1))) * 100 + 50 };
            const toPt = { x: (bestMoveUCI.charCodeAt(2) - 97) * 100 + 50, y: (8 - parseInt(bestMoveUCI.charAt(3))) * 100 + 50 };

            const arrow = document.createElementNS("http://www.w3.org/2000/svg", "line");
            arrow.setAttribute("x1", fromPt.x.toString()); arrow.setAttribute("y1", fromPt.y.toString());
            arrow.setAttribute("x2", toPt.x.toString()); arrow.setAttribute("y2", toPt.y.toString());
            arrow.setAttribute("stroke", "#f59e0b"); arrow.setAttribute("stroke-width", "12");
            arrow.setAttribute("opacity", "0.75"); arrow.setAttribute("marker-end", "url(#arrow-engine)");
            svgArrowsGroup.appendChild(arrow);
        }

        function appendMoveRowDOM(index) {
            const record = Selectors.getMoveAt(index);
            const analysis = Selectors.getAnalysisAt(index);
            if (!record) return;

            const rowId = `move-row-${index}`;
            let row = document.getElementById(rowId);

            if (!row) {
                row = document.createElement('div');
                row.id = rowId; row.className = 'ticker-line';
                row.addEventListener('click', () => { stopAutoplay(); syncPresentationViewIndex(index); });
                logElement.appendChild(row);
            } else {
                row.innerHTML = '';
            }

            if (analysis && analysis.critical) row.classList.add('critical-swing');

            const badge = document.createElement('span');
            badge.className = `badge ${analysis ? analysis.classification.class : 'pending'}`;
            badge.textContent = analysis ? analysis.classification.label : "Computing";

            const text = document.createElement('strong');
            text.textContent = ` Move ${index + 1}: ${record.san}`;

            row.appendChild(badge); row.appendChild(text);

            if (analysis && analysis.explanation) {
                const noteBox = document.createElement('div');
                noteBox.className = `pv-container ${(["blunder", "mistake"].includes(analysis.classification.class) || analysis.critical) ? 'suggestion-box' : ''}`;
                noteBox.textContent = analysis.critical ? `⚠️ High Stakes: ${analysis.explanation}` : `📋 ${analysis.explanation}`;
                row.appendChild(noteBox);
            }
        }

        function patchEvalGraphDotDOM(index) {
            const total = Selectors.getTimelineLength();
            const x = total > 1 ? (index / (total - 1)) * 1000 : 500;
            const analysis = Selectors.getAnalysisAt(index);
            const score = analysis ? analysis.absoluteScore : 0;
            const y = Normalizer.compressToY(score);

            const dotId = `graph-dot-${index}`;
            let dot = document.getElementById(dotId);

            if (!dot) {
                dot = document.createElementNS("http://www.w3.org/2000/svg", "circle");
                dot.id = dotId; dot.classList.add("graph-dot");
                dot.addEventListener('click', () => { stopAutoplay(); syncPresentationViewIndex(index); });
                graphDotsGroup.appendChild(dot);
            }

            dot.setAttribute("cx", x.toString()); dot.setAttribute("cy", y.toString());
            dot.setAttribute("r", index === AppState.replay.index ? "6" : "4");

            if (analysis && analysis.critical) dot.classList.add("critical-dot");
            if (index === AppState.replay.index) dot.classList.add("active-dot"); 
            else dot.classList.remove("active-dot");
        }

        function renderCompleteGraphPath() {
            let pts = [];
            for (let i = 0; i < Selectors.getTimelineLength(); i++) {
                const d = document.getElementById(`graph-dot-${i}`);
                if (d) pts.push(`${d.getAttribute('cx')},${d.getAttribute('cy')}`);
            }
            if (pts.length > 0) graphLine.setAttribute('d', `M ${pts.join(' L ')}`);
        }

        // --- SYNCHRONOUS COMMAND BRAIN CONTROL INTERACTION TRANSITIONS ---
        async function syncPresentationViewIndex(index) {
            if (index < 0 || index >= Selectors.getTimelineLength()) return;
            AppState.replay.index = index;

            const rows = logElement.querySelectorAll('.ticker-line');
            rows.forEach((el, i) => {
                if (i === index) {
                    el.classList.add('active-view');
                    el.scrollIntoView({ block: 'nearest', behavior: 'smooth' });
                } else { el.classList.remove('active-view'); }
            });

            const dots = graphDotsGroup.querySelectorAll('.graph-dot');
            dots.forEach((dot, i) => {
                if (i === index) { dot.classList.add('active-dot'); dot.setAttribute("r", "6"); } 
                else {
                    dot.classList.remove('active-dot');
                    const targetAnalysis = Selectors.getAnalysisAt(i);
                    dot.setAttribute("r", (targetAnalysis && targetAnalysis.critical) ? "5.5" : "4");
                }
            });

            const activeNode = Selectors.getMoveAt(index);
            const activeAnalysis = Selectors.getAnalysisAt(index);

            renderBoardStateFromFen(activeNode.fenAfter, activeNode.highlight);

            if (activeAnalysis) {
                renderEvaluationBarsDOM(activeAnalysis.absoluteScore);
                drawBestMoveArrow(activeAnalysis.bestMoveUCI);
            } else {
                renderEvaluationBarsDOM(null);
                svgArrowsGroup.innerHTML = '';
                
                // Primary Worker processing node fallback step
                const prevFen = index === 0 ? "rnbqkbnr/pppppppp/8/8/8/8/PPPPPPPP/RNBQKBNR w KQkq - 0 1" : Selectors.getMoveAt(index - 1).fenAfter;
                try {
                    statusText.textContent = `Refining current view node...`;
                    engineStatus.style.visibility = 'visible';
                    const realTimeMetrics = await PrimaryWorker.executeAnalysis(prevFen, AppState.session.targetDepth);
                    processEvaluationPayload(index, prevFen, realTimeMetrics);
                    renderCompleteGraphPath();
                    engineStatus.style.visibility = 'hidden';
                } catch(err) { /* Catch active pipeline truncation changes cleanly */ }
            }
        }

        function classifyCPL(loss, isCheckmate, isCritical) {
            if (isCheckmate) return { class: "best", label: "Checkmate" };
            if (loss <= 15) return { class: "best", label: isCritical ? "Sharp Best" : "Best" };
            if (loss <= 45) return { class: "excellent", label: "Excellent" };
            if (loss <= 85) return { class: "good", label: "Good" };
            if (loss <= 160) return { class: "inaccuracy", label: "Inaccuracy" };
            if (loss <= 320) return { class: "mistake", label: "Mistake" };
            return { class: "blunder", label: "Blunder" };
        }

        function stopAutoplay() {
            if (AppState.replay.autoplay.intervalId) {
                clearInterval(AppState.replay.autoplay.intervalId);
                AppState.replay.autoplay.intervalId = null;
                AppState.replay.autoplay.active = false;
                document.getElementById('autoplay-btn').textContent = "Autoplay";
            }
        }

        document.getElementById('autoplay-btn').addEventListener('click', () => {
            if (AppState.replay.autoplay.active) { stopAutoplay(); } 
            else {
                AppState.replay.autoplay.active = true;
                document.getElementById('autoplay-btn').textContent = "Pause";
                AppState.replay.autoplay.intervalId = setInterval(() => {
                    if (AppState.replay.index < Selectors.getTimelineLength() - 1) { syncPresentationViewIndex(AppState.replay.index + 1); } 
                    else { stopAutoplay(); }
                }, 2200);
            }
        });

        document.getElementById('prev-btn').addEventListener('click', () => { stopAutoplay(); syncPresentationViewIndex(AppState.replay.index - 1); });
        document.getElementById('next-btn').addEventListener('click', () => { stopAutoplay(); syncPresentationViewIndex(AppState.replay.index + 1); });

        document.getElementById('submit-pgn-btn').addEventListener('click', () => {
            const rawText = pgnInput.value.trim();
            if (!rawText) return alert("Please enter a valid PGN string.");

            const sanitized = rawText.replace(/\[.*?\]/g, '').replace(/\d+\.\.\./g, '').replace(/\s+/g, ' ').trim();
            const parsingGameInstance = new Chess();
            if (!parsingGameInstance.load_pgn(sanitized)) return alert("Illegal move tracking inside PGN metadata block.");

            const depthSetting = parseInt(document.getElementById('select-depth').value);
            AppState.session.analysisId++;
            AppState.session.targetDepth = depthSetting;

            const currentSession = AppState.session.analysisId;
            AnalysisScheduler.reset(currentSession);

            const executionHistory = parsingGameInstance.history({ verbose: true });
            const stepGameTracker = new Chess();
            
            AppState.game.timeline = executionHistory.map((m) => {
                stepGameTracker.move(m.san);
                return {
                    san: m.san,
                    uci: m.from + m.to + (m.promotion || ''), 
                    fenAfter: stepGameTracker.fen(),
                    highlight: { from: m.from, to: m.to }
                };
            });

            AppState.analysis.evaluations = new Array(AppState.game.timeline.length).fill(null);
            
            logElement.innerHTML = ''; graphDotsGroup.innerHTML = ''; svgArrowsGroup.innerHTML = '';
            graphLine.setAttribute('d', 'M 0 60 L 1000 60');
            document.getElementById('accuracy-white').textContent = '--';
            document.getElementById('accuracy-black').textContent = '--';

            inputPhase.style.display = 'none';
            analysisPhase.style.display = 'flex';

            for (let i = 0; i < Selectors.getTimelineLength(); i++) {
                appendMoveRowDOM(i);
                patchEvalGraphDotDOM(i);
                
                const prevFen = i === 0 ? "rnbqkbnr/pppppppp/8/8/8/8/PPPPPPPP/RNBQKBNR w KQkq - 0 1" : AppState.game.timeline[i - 1].fenAfter;
                AnalysisScheduler.enqueue(i, prevFen, depthSetting);
            }
            
            syncPresentationViewIndex(0);
        });

        initializeStaticChessboardGrid();
        renderBoardStateFromFen("rnbqkbnr/pppppppp/8/8/8/8/PPPPPPPP/RNBQKBNR w KQkq - 0 1");
    </script>
</body>
</html>
